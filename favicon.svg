<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a11"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="3"/>
  <!-- Spine column axis -->
  <line x1="50" y1="18" x2="50" y2="82" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Vertebrae rungs -->
  <line x1="36" y1="28" x2="64" y2="28" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <line x1="33" y1="42" x2="67" y2="42" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <line x1="31" y1="56" x2="69" y2="56" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <line x1="34" y1="70" x2="66" y2="70" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <!-- Right Lipoma (Green - Screen Left in Posterior View) -->
  <circle cx="28" cy="62" r="9" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <!-- Left Lipoma (Orange - Screen Right in Posterior View) -->
  <circle cx="72" cy="60" r="11" fill="#f97316" stroke="#ffffff" stroke-width="2"/>
</svg>
